<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="./js/productos.js"></script>
    <script defer src="./js/main.js"></script>
    <script defer src="./js/funciones.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <input type="text" id="busqueda" class="input" placeholder="Buscar  productos...">
    </header>
    <h1 class="h1">Panadería</h1>
    <section>
        <div class="formulario">
            <h2>Formulario de compra</h2>
            <form id="formulario">
                <label for="nombre">Nombre del producto:</label>
                <input type="text" id="nombre" class="input" name="nombre" required>
                <label for="precio">Precio:</label>
                <input type="number" id="precio" class="input" name="precio" min="1" step="0.01" required>
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" class="input" name="cantidad" min="1" step="1" required>
                <button type="submit" class="enviar">Agregar al carrito</button>
            </form>
        </div>
    </section>
    <section class="section">
        <button id="ver-carrito" class="abrir"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
<path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg></button>
        <div class="carrito">
            <button class="cerrar">X</button>
            <h3>Carrito</h3>
            <ul id="lista"></ul>
            <p class="total" id="total">Total: $0</p>
            <button class="vaciar" id="vaciar">Vaciar carrito</button>
        </div>
    </section>
    <main class="main" id="productos">
        <div class="box">
            <h3>pan</h3>
            <p class="precio">Precio: $1.000</p>
            <button class="btn" data-producto-id="1" type="button">+ Agregar al Carrito</button>
        </div>
        <div class="box">
            <h3 class="nombre">galletitas</h3>
            <p class="precio">Precio: $2.000</p>
            <button class="btn" data-producto-id="2" type="button">+ Agregar al Carrito</button>
        </div>
        <div class="box">
            <h3 class="nombre">facturas</h3>
            <p class="precio">Precio: $1.400</p>
            <button class="btn" data-producto-id="3" type="button">+ Agregar al Carrito</button>
        </div>
        <div class="box">
            <h3 class="nombre">chipitas</h3>
            <p class="precio">Precio: $1.200</p>
            <button class="btn" data-producto-id="4" type="button">+ Agregar al Carrito</button>
        </div>
        <div class="box">
            <h3 class="nombre">torta</h3>
            <p class="precio">Precio: $1.500</p>
            <button class="btn" data-producto-id="5" type="button">+ Agregar al Carrito</button>
        </div>
    </main>
</body>
</html>
